name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload assets to'
        required: true
        default: '0.2.3'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch: 'arm64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'MarkitDown ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## MarkitDown v0.2.3 更新日志

            ### 🖼️ 图标全面更新
            - 重新生成全平台应用图标（Windows/macOS/Linux/iOS/Android）
            - SVG 源图标简化为圆角矩形背景 + M 字母，更清晰现代
            - 图标生成脚本优化精简

            ### 🎨 标题栏与菜单优化
            - **应用品牌菜单**：新增 MarkitDown 应用名称菜单项，包含快捷键说明、Markdown 语法、检查更新、关于等入口
            - **标题栏拖拽优化**：移除旧的全区域拖拽，改为专用拖拽间隔区域，避免与菜单交互冲突
            - **双击最大化**：标题栏拖拽区域支持双击切换最大化/还原
            - **窗口标题**：页面 title 统一为 "MarkitDown"（首字母大写）
            - **性能优化**：窗口控制按钮使用 useCallback 缓存，减少不必要的重渲染

            ### 📝 文档修正
            - README 技术栈中 React 版本修正为 18（原误写为 19）
            - 关于对话框信息更新至最新版本

            ### 📦 安装包

            | 平台 | 架构 | 安装包格式 |
            | --- | --- | --- |
            | Windows | x86_64 | `.msi` / `.exe` (NSIS) |
            | macOS Intel | x86_64 | `.dmg` / `.app.tar.gz` |
            | macOS Apple Silicon | arm64 | `.dmg` / `.app.tar.gz` |
            | Linux | x86_64 | `.deb` / `.rpm` / `.AppImage` |
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
