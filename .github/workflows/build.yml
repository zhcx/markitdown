name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch: 'arm64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MarkitDown ${{ github.ref_name }}'
          releaseBody: |
            ## v0.1.9 更新内容

            ### AI 对话面板
            - 新增右侧 **AI 对话** 侧边面板，支持与 AI 进行自由对话。
            - 面板可拖拽调整宽度（280px-500px），与校对面板共享拖拽逻辑。
            - 工具栏新增 💬 按钮快速切换对话面板。

            ### 思维链流式输出
            - 支持 DeepSeek / 硅基流动模型的**思考过程实时流式展示**。
            - 思考阶段：思维链自动展开，逐字流式显示思考内容。
            - 回答阶段：思考完成后自动折叠，切换为回答内容流式输出。
            - 修复了思维链不显示的问题（请求中增加 `thinking` 字段，且仅对支持的服务商启用）。

            ### 思考模式控制
            - 新增 **思考强度** 下拉菜单：关闭 / 快速 / 均衡 / 深度。
            - 关闭模式下不传递 temperature/max_tokens 参数，由模型使用默认值。
            - 不同模式映射不同的 temperature 和 max_tokens 配置。

            ### 关联文档上下文
            - 新增 📋 **关联当前文档** 按钮，点击后将正在编辑的文档内容发送给 AI。
            - 关联后对话气泡上方显示文档名称，支持一键取消关联。
            - AI 可在对话中基于当前文档内容回答问题、续写、纠错等。

            ### 文件附件上传
            - 新增 📎 **附件上传** 按钮，支持图片（png/jpg/gif/webp 等）和文本文件（txt/md/json/yaml/csv 等）。
            - 图片以 base64 内嵌发送，文本文件以代码块包裹发送。
            - 附件以 chip 形式显示在输入区上方，可单独删除。

            ### 自动更新
            - 新增 GitHub Release **版本检测** 功能（菜单 → 帮助 → 检查更新）。
            - 发现新版本后可**一键下载并安装**，实时显示下载进度。
            - 安装程序下载完成后自动启动，应用自动退出。

            ### 后端改进
            - 新增 `ai_chat_streaming` 命令，实现 SSE 流式 API 调用与前端事件推送。
            - 新增 `download_and_install_update` 命令，实现安装包下载与启动。
            - 新增 `build_chat_messages` 辅助函数，统一流式/非流式消息构建逻辑。
            - `ChatRequest` 结构体新增 `thinking` 可选字段。
            - 新增 `futures-util` 依赖用于流式下载。

            ## 安装包说明

            | 平台 | 架构 | 安装包格式 |
            | --- | --- | --- |
            | Windows | x86_64 | `.msi` / `.exe` (NSIS) |
            | macOS Intel | x86_64 | `.dmg` / `.app.tar.gz` |
            | macOS Apple Silicon | arm64 | `.dmg` / `.app.tar.gz` |
            | Linux | x86_64 | `.deb` / `.rpm` / `.AppImage` |
          releaseDraft: false
          prerelease: false
          target: ${{ matrix.target }}
          args: --target ${{ matrix.target }}
