name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build
        required: true

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create release or clear existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].id' |
              while read -r asset_id; do
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              done
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "MarkitDown $RELEASE_TAG" \
              --notes "Cross-platform MarkitDown release. Signing status is shown by each artifact's Authenticode signature. Policy: https://github.com/zhcx/markitdown/blob/main/CODE_SIGNING_POLICY.md. When enabled: Free code signing provided by SignPath.io, certificate by SignPath Foundation."
          fi

  build-non-windows:
    name: ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: MarkitDown ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  build-windows:
    name: Windows x64 — two-stage signing
    needs: prepare-release
    runs-on: windows-latest
    env:
      WINDOWS_TARGET: x86_64-pc-windows-msvc
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-converter.lock

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Detect SignPath configuration
        id: signpath
        shell: pwsh
        run: |
          $required = @(
            $env:SIGNPATH_API_TOKEN,
            $env:SIGNPATH_ORGANIZATION_ID,
            $env:SIGNPATH_PROJECT_SLUG,
            $env:SIGNPATH_SIGNING_POLICY_SLUG,
            $env:SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG,
            $env:SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG
          )
          $enabled = -not ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          if ($enabled) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            "SIGNPATH_ENABLED=true" >> $env:GITHUB_ENV
            Write-Host "SignPath two-stage signing is enabled. Each request requires manual approval."
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "SIGNPATH_ENABLED=false" >> $env:GITHUB_ENV
            Write-Warning "SignPath is not fully configured. Publishing explicitly unsigned Windows installers."
          }

      - name: Build hash-locked document converter
        shell: pwsh
        run: ./scripts/build-document-converter.ps1

      - name: Build unsigned application executable
        run: npm run tauri build -- --target ${{ env.WINDOWS_TARGET }} --no-bundle --no-sign

      - name: Collect unsigned inner executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath-stage-1 | Out-Null
          Copy-Item "src-tauri/target/$env:WINDOWS_TARGET/release/markitdown.exe" signpath-stage-1/markitdown.exe
          Copy-Item src-tauri/resources/document_converter.exe signpath-stage-1/document_converter.exe

      - name: Upload inner executables for provenance
        id: upload-unsigned-executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-executables-${{ github.run_id }}
          path: signpath-stage-1
          if-no-files-found: error
          retention-days: 14

      - name: Submit inner executables to SignPath (manual approval)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-executables.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-stage-1

      - name: Install signed inner executables
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedApp = Get-ChildItem signed-stage-1 -Recurse -File -Filter markitdown.exe | Select-Object -First 1
          $signedConverter = Get-ChildItem signed-stage-1 -Recurse -File -Filter document_converter.exe | Select-Object -First 1
          if (-not $signedApp -or -not $signedConverter) { throw "SignPath did not return both inner executables." }
          Copy-Item $signedApp.FullName "src-tauri/target/$env:WINDOWS_TARGET/release/markitdown.exe" -Force
          Copy-Item $signedConverter.FullName src-tauri/resources/document_converter.exe -Force

      - name: Verify signed inner executables
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -BundleDirectory signed-stage-1

      - name: Bundle MSI and NSIS installers
        run: npm run tauri bundle -- --target ${{ env.WINDOWS_TARGET }} --bundles msi,nsis --no-sign

      - name: Collect unsigned installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath-stage-2 | Out-Null
          $bundleRoot = "src-tauri/target/$env:WINDOWS_TARGET/release/bundle"
          $installers = Get-ChildItem $bundleRoot -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if (($installers | Measure-Object).Count -lt 2) { throw "Expected both MSI and NSIS installers." }
          $installers | Copy-Item -Destination signpath-stage-2

      - name: Upload installers for provenance
        id: upload-unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-installers-${{ github.run_id }}
          path: signpath-stage-2
          if-no-files-found: error
          retention-days: 14

      - name: Submit installers to SignPath (manual approval)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-stage-2

      - name: Verify signed installers
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -BundleDirectory signed-stage-2

      - name: Publish Windows installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = if ($env:SIGNPATH_ENABLED -eq 'true') { 'signed-stage-2' } else { 'signpath-stage-2' }
          $installers = Get-ChildItem $source -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          foreach ($installer in $installers) {
            gh release upload $env:RELEASE_TAG $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading $($installer.Name) failed." }
          }
