name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload assets to'
        required: true
        default: '0.2.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch: 'arm64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'MarkitDown ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## 更新日志

            ### 🎨 UI 现代化
            - CSS 样式全面重写：从 6,956 行精简至 3,162 行（减少 55%），消除 4 轮重复变量定义
            - 统一设计 token 体系：间距、圆角、阴影、颜色全部通过 CSS 变量管理
            - 修复所有硬编码颜色，确保三套主题（亮色/暗色/Solarized）完全适配
            - 简化视觉噪音：移除 body 背景光晕、按钮 hover 动画，采用更扁平的现代风格
            - AI 对话按钮调整到工具栏第一位，方便快速调用

            ### 🤖 AI 校对优化
            - 校对 Prompt 精简优化，提高模型返回 JSON 的可靠性
            - 增强 JSON 解析容错：支持逐行扫描、宽松匹配、多格式提取
            - 前端自动重试机制：网络/超时错误自动重试 2 次
            - 空内容优雅处理：API 返回空内容时视为”未发现问题”而非报错
            - 长文档校对超时从 90s 提升至 300s，HTTP 超时从 60s 提升至 120s
            - 并发分块数从 2 提升至 4，长文档校对速度提升

            ### 🐛 修复
            - 修复资源管理器操作按钮竖向排列的布局问题
            - 修复分屏模式下预览框右侧空白区域
            - 修复深色模式下 .mode-btn 硬编码渐变色

            ## 安装包

            | 平台 | 架构 | 安装包格式 |
            | --- | --- | --- |
            | Windows | x86_64 | `.msi` / `.exe` (NSIS) |
            | macOS Intel | x86_64 | `.dmg` / `.app.tar.gz` |
            | macOS Apple Silicon | arm64 | `.dmg` / `.app.tar.gz` |
            | Linux | x86_64 | `.deb` / `.rpm` / `.AppImage` |
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
