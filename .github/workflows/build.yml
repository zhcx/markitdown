name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload assets to'
        required: true
        default: 'v0.2.4'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch: 'arm64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'MarkitDown ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## MarkitDown v0.2.4 更新日志

            ### 🧭 编辑与预览同步滚动
            - 分屏模式下，滚动编辑框时预览框会同步到相应阅读位置
            - 滚动预览框时，编辑框也会同步到对应编辑位置
            - 增加程序化滚动来源标记，避免两侧滚动事件互相循环触发

            ### 📖 预览阅读体验优化
            - 预览正文宽度与编辑框对齐，减少左右留白
            - 预览内容最大宽度统一到编辑器正文宽度，分屏浏览更一致
            - 修复长链接在预览中不自动换行、撑破版面的情况

            ### 📦 版本与更新页面
            - 应用版本更新至 v0.2.4
            - 关于页面版本号同步更新
            - GitHub Release 更新说明同步展示本次功能变化和平台安装包列表

            ### 📦 安装包

            | 平台 | 架构 | 安装包格式 |
            | --- | --- | --- |
            | Windows | x86_64 | `.msi` / `.exe` (NSIS) |
            | macOS Intel | x86_64 | `.dmg` / `.app.tar.gz` |
            | macOS Apple Silicon | arm64 | `.dmg` / `.app.tar.gz` |
            | Linux | x86_64 | `.deb` / `.rpm` / `.AppImage` |
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
