name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload assets to
        required: true
        default: v0.2.9

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    name: Clear existing release assets
    runs-on: ubuntu-latest
    steps:
      - name: Remove assets from the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].id' 2>/dev/null |
            while read -r asset_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done || true

  build:
    name: ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: MarkitDown ${{ env.RELEASE_TAG }}
          releaseBody: |
            ## MarkitDown v0.2.9 更新日志

            ### 工作区、性能与资源管理器
            - 资源管理器支持列出更多可转换文件，点击支持格式可直接转换为 Markdown；文件图标升级为 VS Code 风格的类型图标。
            - 新增工作区级全文搜索、正则、大小写、扩展名与忽略目录筛选，以及搜索历史和结果跳转。
            - 跨文件替换固定采用“预览中文语义 Diff → 最后确认写入”流程；大目录搜索可取消显示结果。
            - 优化长文档体验：Mermaid 延迟渲染、预览延后更新、分栏拖动合帧，以及工作区文件树相关性能策略。

            ### Markdown、导出与公众号排版
            - 完善 KaTeX 公式与 Mermaid 图表支持，工具栏可快速插入流程图、时序图和甘特图。
            - HTML、PDF、PNG 导出统一为模板系统，提供文章、论文、公文、技术文档、长图、A4、README 和自定义 CSS 模板。
            - 新增原创微信公众号排版导出：六套主题、全内联样式、实时预览、保存 HTML 与一键复制富文本。

            ### 可控 AI 与研究写作
            - AI 重写、翻译、摘要、大纲、伴写与校对默认进入建议模式，显示 Diff、修改依据，并支持逐处应用、拒绝与整轮撤销。
            - 新增询问、建议、代理三种 AI 操作模式；关键写入点均需要确认。
            - 工作区上下文支持多文件、章节选择、本地片段检索、Token 估算、敏感文件排除及本轮发送内容披露。
            - 网络搜索保留来源标题、域名、发布时间、访问时间与 Markdown 脚注导出。

            ### 界面与稳定性
            - 优化搜索面板布局、文本选择对比度与深浅主题一致性。
            - 移除项目内所有 Skills 管理与注入功能，简化 AI 配置与构建依赖。

            ### 各平台安装包对应表
            | 平台 | 架构 | 发布资产 |
            | --- | --- | --- |
            | Windows | x64 | `.msi`、`.exe`（NSIS） |
            | macOS | Apple Silicon (arm64) | `.dmg`、`.app.tar.gz` |
            | macOS | Intel (x64) | `.dmg`、`.app.tar.gz` |
            | Linux | x64 | `.deb`、`.rpm`、`.AppImage` |
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
