name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch: 'arm64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MarkitDown ${{ github.ref_name }}'
          releaseBody: |
            ## 更新内容

            ### AI 伴写功能修复
            - 修复了「AI 未返回可用续写，请刷新重试」问题：优化了后端 JSON 数组解析逻辑，正确处理字符串内的方括号。

            ### AI 设置增强
            - 新增 **硅基流动 (SiliconFlow)** 服务商支持，自动填入默认 API 端点和模型。
            - API 密钥输入框新增 👁 显示/隐藏切换按钮，方便确认输入。
            - API 端点字段始终可见，切换服务商自动填入默认地址。
            - 新增 **获取模型列表** 按钮，填写 API KEY 和端点后可从服务商拉取可用模型列表。
            - 切换服务商时自动保存/恢复各家的 API KEY，无需重复填写。

            ### 其他改进
            - 后端新增 `anthropic` API 支持（带 `anthropic-version` 头部 /v1/messages 端点）。
            - 后端新增 `fetch_ai_models` 命令，支持从 OpenAI 兼容 API 拉取模型列表。

            ## 安装包说明

            | 平台 | 架构 | 安装包 |
            | --- | --- | --- |
            | Windows x64 | x86_64 | `.msi` / `.exe` |
            | macOS Intel | x86_64 | `.dmg` / `.app.tar.gz` |
            | macOS Apple Silicon | arm64 | `.dmg` / `.app.tar.gz` |
            | Linux | x86_64 | `.deb` / `.rpm` / `.AppImage` |
          releaseDraft: false
          prerelease: false
          target: ${{ matrix.target }}
          args: --target ${{ matrix.target }}
