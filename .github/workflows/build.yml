name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload assets to'
        required: true
        default: '0.2.2'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch: 'arm64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'MarkitDown ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## MarkitDown v0.2.2 更新日志

            ### 🎨 纸张式 UI 全面改造
            - **主题统一**：珊瑚色强调色体系（Light: `#C96B52` / Dark: `#DC846A`），替换原有蓝色紫色系
            - **自定义标题栏**：关闭原生 Windows 标题栏，自绘标题栏融入菜单栏，仅保留应用图标 + 窗口控制按钮
            - **圆角标准化**：统一为 6px（小型控件）/ 8px（工具组）/ 12px（工作区），去除 16px+ 大圆角
            - **资源管理器图标**：新建/打开文件/打开文件夹按钮更换为现代 SVG 内联图标
            - **大纲面板修复**：点击大纲按钮现在能正确显示，不再受侧边栏状态影响

            ### 🛡️ 校对崩溃全面修复
            - **NaN 毒性过滤**：严格校验 AI 返回的 from/to 必须为合法数字，过滤 NaN/undefined/null
            - **CodeMirror 装饰防护**：排序 + 范围校验 + try-catch 三层防御，防止 RangeSetBuilder 崩溃
            - **Rust task 级 panic 隔离**：所有 AI 操作通过 `tokio::task::spawn` 隔离，panic 不再杀死进程
            - **分块容错**：单个校对分块失败不影响其他分块，仅全部失败时才报错
            - **并发防护**：重复点击校对按钮不再发起并发请求
            - **崩溃日志**：panic 信息写入 `%TEMP%\markitdown_crash.log`，便于诊断

            ### 🤖 AI 功能优化
            - 校对超时从 90s 提升至 300s，长文档校对更稳定
            - HTTP 客户端 `OnceLock` 竞争安全处理，不再因并发初始化 panic
            - `checkProofread` 内的重试机制保留网络/超时错误自动重试

            ### 📦 安装包

            | 平台 | 架构 | 安装包格式 |
            | --- | --- | --- |
            | Windows | x86_64 | `.msi` / `.exe` (NSIS) |
            | macOS Intel | x86_64 | `.dmg` / `.app.tar.gz` |
            | macOS Apple Silicon | arm64 | `.dmg` / `.app.tar.gz` |
            | Linux | x86_64 | `.deb` / `.rpm` / `.AppImage` |
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
