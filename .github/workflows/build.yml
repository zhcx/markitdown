name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload assets to
        required: true
        default: v0.3.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    name: Clear existing release assets
    runs-on: ubuntu-latest
    steps:
      - name: Remove assets from the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].id' 2>/dev/null |
            while read -r asset_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done || true

  build:
    name: ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            signing_config: ''
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            signing_config: ''
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            signing_config: --config src-tauri/tauri.windows-signing.conf.json
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            signing_config: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Windows code signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/prepare-windows-signing.ps1

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: MarkitDown ${{ env.RELEASE_TAG }}
          releaseBody: |
            ## MarkitDown v0.3.0 更新日志

            ### Monaco 编辑器与 Markdown 能力
            - 编辑器升级为 Monaco，完善自动换行、当前行高亮、滚动区域和长文本边界处理。
            - 采用 GitHub 风格 Markdown 渲染，支持任务列表、KaTeX、代码高亮，以及 Mermaid 流程图、时序图和甘特图。
            - 新增 Markdown 语法入门与速查、语法检查和格式化、原生 Emoji 与常用表情。
            - 支持粘贴图片后自动保存或上传图床；未配置图床时提供设置引导，并支持插入 B 站、YouTube、YouTube Shorts 和 Vimeo 视频。
            - 中文内容不再触发 Monaco 易混淆字符误报，同时继续检测零宽字符等真正可疑的不可见字符。

            ### 沉浸体验与文档导航
            - 沉浸入口可选择“沉浸阅读”或“沉浸写作”，两种模式均尽可能扩大内容空间并保留可折叠大纲。
            - 沉浸写作保留编辑器快捷工具栏；沉浸阅读和沉浸写作均可打开 AI Chatbox。
            - 编辑器与预览同步滚动体验优化，打开文件后可依据 Markdown 标题自动生成并显示大纲。

            ### 设置、菜单与界面优化
            - AI 助手设置与网络搜索设置分区展示，复选框统一升级为滑动开关。
            - 字号默认 14px、默认行高 1.4，设置同步应用到编辑器、预览和 AI 对话，并改善不同主题下的滑动条显示。
            - 统一选择框、输入框、弹出菜单和滚动条样式；弹出菜单采用圆角边框并支持点击空白处收起。
            - Windows“编辑”菜单合并到“功能”菜单，修复主题子菜单和文件导出子菜单无法弹出的问题。
            - 字数统计合并显示中文字符、英文单词与总字符数。

            ### 各平台安装包对应表
            | 平台 | 架构 | 发布资产 |
            | --- | --- | --- |
            | Windows | x64 | `.msi`、`.exe`（NSIS） |
            | macOS | Apple Silicon (arm64) | `.dmg`、`.app.tar.gz` |
            | macOS | Intel (x64) | `.dmg`、`.app.tar.gz` |
            | Linux | x64 | `.deb`、`.rpm`、`.AppImage` |
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.signing_config }}

      - name: Verify Windows installer signatures
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1
