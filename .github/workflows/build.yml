name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload assets to
        required: true
        default: v0.2.6

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: MarkitDown ${{ env.RELEASE_TAG }}
          releaseBody: |
            ## MarkitDown v0.2.6 更新日志

            ### 文档转换与稳定性
            - 集成 Microsoft MarkItDown 文档转换，支持 PDF、Word、Excel、PowerPoint 等文件导入 Markdown。
            - 转换在后台执行，底部状态栏显示进度与结果；大文档转换增加临时文件交接与错误诊断，稳定性更高。
            - Windows 发布包内置转换器依赖，安装后即可使用。

            ### Inkwell 主题与编辑体验
            - 新增并默认启用 Inkwell Light / Dark 主题。
            - 优化标签页层级、活动状态和未保存标记；最后一个标签关闭后自动创建空白标签。
            - 长文档分屏同步滚动改为按动画帧合并调度，减少卡顿和双向抖动。

            ### 资源管理器与时间线
            - 文件栏升级为 VS Code 风格资源管理器：打开的编辑器、工作区、文档大纲和时间线集中展示。
            - 打开文件时自动加载同级目录；文件夹可按树形列表展开。
            - 时间线保存编辑快照，支持点击回退，并保留回退前版本。

            ### AI 助手
            - 顶部 AI 入口未配置时直达 AI 设置页，已配置时直接打开 Chatbox。
            - 优化 Chatbox 输入区、附件/文档关联图标与推理强度选择器。
            - 网页预览支持通过兼容 OpenAI 的 `/models` 接口获取硅基流动模型列表。

            ### 各平台安装包对应表
            | 平台 | 架构 | 发布资产 |
            | --- | --- | --- |
            | Windows | x64 | `.msi`、`.exe`（NSIS） |
            | macOS | Apple Silicon (arm64) | `.dmg`、`.app.tar.gz` |
            | macOS | Intel (x64) | `.dmg`、`.app.tar.gz` |
            | Linux | x64 | `.deb`、`.rpm`、`.AppImage` |
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
