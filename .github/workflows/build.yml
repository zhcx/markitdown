name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload assets to
        required: true
        default: v0.2.8

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: MarkitDown ${{ env.RELEASE_TAG }}
          releaseBody: |
            ## MarkitDown v0.2.8 更新日志

            ### 工作台与主题
            - 新增 VS Code 风格左侧活动栏，统一放置资源管理器、搜索、AI 对话、沉浸模式、明暗切换与设置入口。
            - 编辑器、预览和 AI 面板采用贯穿式分隔线与紧凑标签页，编辑器和预览默认等宽，并在校对或 AI 面板展开时自适应布局。
            - 完善 VS Code、Inkwell、Claude、Notion 明暗主题，降低深色模式反差并统一背景层级、文字、边框、强调色和图标颜色。
            - 优化主题启动闪烁和网页端明暗切换卡顿，默认使用 VS Code Dark Theme。

            ### 编辑器、资源管理器与时间线
            - 编辑器和预览分别提供文件标签页，编辑快捷按钮移入编辑区并扩充常用 Markdown 功能。
            - 资源管理器支持同时打开多个文件夹并以树状结构展示；统一标题字号、文件颜色、未保存标记、长文件名截断和线性 SVG 图标。
            - 时间线支持查看、预览、差异对比、恢复和删除历史版本，并自动清理过旧或过多的记录；操作摘要与完整内容更加一致。
            - 优化编辑器行号占用宽度、窗格拖动性能和同步比例，修复回车一次跳两行的问题。

            ### AI 对话与网络搜索
            - AI 输入框改为一体化低反差设计，聚焦和输入时不再出现内层方框；生成回复时发送按钮切换为停止按钮，并允许继续准备下一轮问题。
            - 用户消息点击发送后立即进入对话区，优化请求启动延迟、流式响应和浏览器端 AI 服务访问。
            - 网络搜索结果按来源条目分组展示，搜索结束后自动折叠；设置页新增首选搜索服务，并扩大 SearXNG API 地址输入区域。
            - 优化服务商与模型选择器的完整显示、网页请求超时提示以及搜索工具栏图标对齐。

            ### Skills、设置与个性化
            - AI 设置新增 Skills 管理，可导入、启用、停用和维护 Skill；Chatbox 工具栏支持按本轮对话选择 Skills。
            - 修复启用 Skills 时 `ai_chat_streaming` 缺少 `requestId` 的调用错误。
            - 设置页面升级为分栏结构，新增界面字体与内容字体设置，支持读取、搜索并选择本机字体。
            - Windows 自定义标题栏支持双击最大化；最大化状态双击可还原窗口并居中。

            ### 稳定性与构建
            - 补充 `fflate` 依赖，修复 Skill 压缩包导入和构建缺失依赖问题。
            - 优化网页预览、桌面端主题切换、AI 状态更新与多窗格尺寸变化的一致性。

            ### 各平台安装包对应表
            | 平台 | 架构 | 发布资产 |
            | --- | --- | --- |
            | Windows | x64 | `.msi`、`.exe`（NSIS） |
            | macOS | Apple Silicon (arm64) | `.dmg`、`.app.tar.gz` |
            | macOS | Intel (x64) | `.dmg`、`.app.tar.gz` |
            | Linux | x64 | `.deb`、`.rpm`、`.AppImage` |
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
