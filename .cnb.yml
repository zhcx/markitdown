main:
  push:
    - name: verify
      docker:
        image: node:20-bookworm
      stages:
        - name: install dependencies
          script: npm ci
        - name: lint
          script: npm run lint
        - name: test
          script: npm test
        - name: build frontend
          script: npm run build

$:
  tag_push:
    - name: linux-release
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: node:20-bookworm
      env:
        TAURI_TARGET: x86_64-unknown-linux-gnu
      stages:
        - name: install system dependencies
          script: |
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential \
              curl \
              file \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libssl-dev \
              libwebkit2gtk-4.1-dev \
              patchelf \
              pkg-config \
              rpm
        - name: install rust
          script: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            rustup target add "$TAURI_TARGET"
            rustc --version
            cargo --version
        - name: install frontend dependencies
          script: npm ci
        - name: lint and test
          script: |
            npm run lint
            npm test
        - name: build linux bundles
          script: |
            . "$HOME/.cargo/env"
            npm run tauri build -- --target "$TAURI_TARGET"
        - name: prepare release notes
          script: |
            cat > CNB_RELEASE.md <<EOF
            MarkitDown ${CNB_BRANCH}

            Linux x86_64 packages built automatically by CNB.
            Windows and macOS packages still require native Windows/macOS runners.
            EOF
        - name: create cnb release
          type: git:release
          options:
            title: MarkitDown ${CNB_BRANCH}
            descriptionFromFile: CNB_RELEASE.md
            latest: true
            overlying: true
        - name: upload linux bundles
          image: cnbcool/attachments:latest
          settings:
            tag: ${CNB_BRANCH}
            attachments:
              - src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
              - src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.rpm
              - src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
